[project]
name = "weekly-loop-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "itsdangerous>=2.2",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "tzdata>=2025.1",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
